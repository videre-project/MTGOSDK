name: Test
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

env:
  WORKSPACE_PATH: D:\workspace

permissions:
  statuses: write

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: "Run SDK Tests"
    runs-on: windows-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Setup Dev Drive and Checkout
        id: setup_dev_drive_checkout
        uses: videre-project/MTGOSDK/.github/actions/setup-dev-drive@main
        with:
          ref: ${{ github.event.workflow_run.head_commit.id }}

      - name: Update Commit Status - Pending
        uses: ./.github/actions/update-commit-status
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.event.workflow_run.head_sha }}
          state: 'pending'
          description: 'SDK tests are running...'
          status_context: 'Test / Run SDK Tests'

      - name: Download MTGOSDK Feed
        uses: ./.github/actions/download-artifact
        with:
          name: mtgosdk-feed
          path: ${{ env.WORKSPACE_PATH }}/packages
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET Environment
        uses: ./.github/actions/setup-dotnet
        with:
          WORKSPACE_PATH: ${{ env.WORKSPACE_PATH }}
          SKIP_RESTORE: 'true'

      # Create .env file for integration tests
      - name: Create .env file
        run: |
          echo "USERNAME=${{ secrets.USERNAME }}" > .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
        shell: powershell
        working-directory: ${{ env.WORKSPACE_PATH }}

      # Run the test suite
      #
      # This will re-run restore for the MTGOSDK.Tests project only, which
      # should ensure that our end-to-end test project can correctly resolve
      # our SDK packages from the local feed without any transitive information
      # leaking in from the main solution restore.
      #
      - name: Run tests
        run: |
          "DIVER_LOG_PATH=$env:LOCALAPPDATA/MTGOSDK/Logs" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $settingsPath = Join-Path $env:RUNNER_TEMP 'nunit.runsettings'
          @"
          <RunSettings>
            <NUnit>
              <TestOutputXml>$env:WORKSPACE_PATH/test-results</TestOutputXml>
            </NUnit>
          </RunSettings>
          "@ | Set-Content -Path $settingsPath
          dotnet test --project MTGOSDK.Tests -p:UseLocalFeed=True --settings $settingsPath
        shell: powershell
        working-directory: ${{ env.WORKSPACE_PATH }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.WORKSPACE_PATH }}/test-results/*.xml
            ${{ env.WORKSPACE_PATH }}/MTGOSDK.Tests/bin/**/.testresults-*.log
            ${{ env.WORKSPACE_PATH }}/MTGOSDK.Tests/bin/**/MTGOSDK.Tests*.log
          include-hidden-files: true
          retention-days: 7

      # Upload the Diver logs for debugging test failures or crashes
      - if: ${{ failure() }}
        name: Upload Diver Logs
        uses: actions/upload-artifact@v4
        with:
          name: diver-logs
          path: ${{ env.DIVER_LOG_PATH }}/*
          retention-days: 7

      # Upload the MSBuild binary log
      - if: ${{ always() }}
        name: Upload Binary Log
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-binlog
          path: ${{ env.WORKSPACE_PATH }}/logs/msbuild.binlog
          retention-days: 7

      - name: Show test logs
        if: always()
        run: |
          Get-ChildItem -Path "$env:WORKSPACE_PATH/MTGOSDK.Tests/bin" -Recurse -File -Force `
            -Include '.testresults-*.log', 'MTGOSDK.Tests*.log' -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content -LiteralPath $_.FullName }
        shell: powershell

      - name: Summarize test results
        if: always()
        run: |
          $testResultsPath = Join-Path $env:WORKSPACE_PATH 'test-results/MTGOSDK.Tests.xml'
          if (-not (Test-Path $testResultsPath)) {
            @(
              "TEST_RESULTS_LABEL=Critical error"
              "TEST_RESULTS_DESCRIPTION=Test workflow failed"
            ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            throw "NUnit result file was not produced: $testResultsPath"
          }

          [xml]$results = Get-Content -Raw -Path $testResultsPath
          $testRun = $results.'test-run'
          $testCount = [int]$testRun.total
          $successCount = [int]$testRun.passed
          $duration = [math]::Round(
            [double]::Parse($testRun.duration, [cultureinfo]::InvariantCulture), 2)
          $formattedDuration = if ($duration -ge 60) {
            "{0}m {1:F2}s" -f [math]::Floor($duration / 60), ($duration % 60)
          } else {
            "{0:F2}s" -f $duration
          }
          $runPassed = $testRun.result -eq 'Passed'
          $label = if (-not $runPassed) {
            "Failing after $formattedDuration"
          } elseif ($env:TEST_RESULT -eq 'success') {
            "Successful in $formattedDuration"
          } else {
            "Workflow failed after $formattedDuration"
          }

          $description = "$successCount/$testCount tests passed"
          $fixtureFailure = $results.SelectSingleNode("//test-suite[@result='Failed' and (@site='SetUp' or @site='TearDown')]")
          if ($fixtureFailure) {
            $phase = if ($fixtureFailure.site -eq 'SetUp') { 'setup' } else { 'teardown' }
            Write-Output "::error title=Test $phase failed::See the NUnit $phase exception in the test output and test-results artifact."
            $description = "Test $phase failed; $description"
          }

          @(
            "TEST_RESULTS_LABEL=$label"
            "TEST_RESULTS_DESCRIPTION=$description"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if (-not $runPassed) {
            throw "NUnit reported $($testRun.result); see the test output and test-results artifact."
          }
        shell: powershell
        env:
          # Report success or failure based on the workflow run status
          TEST_RESULT: ${{ job.status == 'success' && 'success' || 'failure' }}

      - name: Update Commit Status - Result
        if: always()
        uses: ./.github/actions/update-commit-status
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ github.event.workflow_run.head_sha }}
          state: ${{ job.status }}
          description: '${{ env.TEST_RESULTS_LABEL }} - ${{ env.TEST_RESULTS_DESCRIPTION }}'
          status_context: 'Test / Run SDK Tests'
